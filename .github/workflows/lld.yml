# The standalone lld the layouts use (see LldVersion in src/bflat/bflat.csproj),
# published as the release lld-<version>: for Linux, built from source with
# nothing optional; for Windows and macOS (arm64), LLVM's own lld, which needs
# only the system. Builds when this workflow or the scripts change (which is
# when LldVersion changes); publishes only when run by hand, and then only the
# files the release doesn't have yet.
name: lld

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/lld.yml
      - tools/build-lld.sh
      - tools/check-lld-win.sh
      - tools/check-lld-mac.sh

permissions:
  contents: write

env:
  LLD_VERSION: 20.1.8

jobs:
  build:
    strategy:
      matrix:
        include:
          - { rid: linux-x64, runner: ubuntu-22.04 }
          - { rid: linux-arm64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build lld in ubuntu:22.04
        run: |
          mkdir out
          docker run --rm -v "$PWD/tools:/tools:ro" -v "$PWD/out:/out" ubuntu:22.04 /tools/build-lld.sh /out
          tools/check-lld.sh out/lld
          tar -czf lld-${{ matrix.rid }}.tar.gz -C out lld
      - uses: actions/upload-artifact@v4
        with:
          name: lld-${{ matrix.rid }}
          path: lld-${{ matrix.rid }}.tar.gz

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Take lld.exe from LLVM's Windows release
        run: |
          mkdir out
          curl -sL "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLD_VERSION/clang+llvm-$LLD_VERSION-x86_64-pc-windows-msvc.tar.xz" \
            | tar -xJ --wildcards --strip-components=2 -C out '*/bin/lld.exe'
          tools/check-lld-win.sh out/lld.exe
          tar -czf lld-win-x64.tar.gz -C out lld.exe
      - uses: actions/upload-artifact@v4
        with:
          name: lld-win-x64
          path: lld-win-x64.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Take lld from LLVM's macOS arm64 release
        run: |
          mkdir out
          curl -sL "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLD_VERSION/LLVM-$LLD_VERSION-macOS-ARM64.tar.xz" \
            | tar -xJ --strip-components=2 -C out '*/bin/lld'
          tools/check-lld-mac.sh out/lld
          tar -czf lld-osx-arm64.tar.gz -C out lld
      - uses: actions/upload-artifact@v4
        with:
          name: lld-osx-arm64
          path: lld-osx-arm64.tar.gz

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: [build, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "lld-$LLD_VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Only what's missing: replacing a file would change what earlier
            # layouts were built with.
            have=$(gh release view "lld-$LLD_VERSION" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
            for f in lld-*.tar.gz; do
              grep -qx "$f" <<< "$have" && continue
              gh release upload "lld-$LLD_VERSION" "$f" --repo "$GITHUB_REPOSITORY"
            done
          else
            gh release create "lld-$LLD_VERSION" lld-*.tar.gz --repo "$GITHUB_REPOSITORY" \
              --title "lld $LLD_VERSION for bflat's Linux layouts" \
              --notes "LLVM's lld $LLD_VERSION built with no optional dependencies (tools/build-lld.sh). Apache-2.0 WITH LLVM-exception."
          fi
